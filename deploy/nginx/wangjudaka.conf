# 网剧大咖 · Nginx 反向代理（HTTPS）
#
# 为什么必须有 HTTPS：微信小程序的 request 合法域名只接受 https，
# 且要求 TLS 1.2 以上、证书由受信任 CA 签发（Let's Encrypt 可以）。
#
# 用法：
#   1. 把本文件放到 /etc/nginx/conf.d/wangjudaka.conf
#   2. 把 server_name 换成你的已备案域名（两处）
#   3. 证书路径按实际修改（certbot 默认在 /etc/letsencrypt/live/<域名>/）
#   4. nginx -t && systemctl reload nginx
#
# 证书获取（最简单）：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d api.example.com
#   certbot renew --dry-run        # 确认自动续期可用

upstream wangju_api {
    # 服务端默认监听 0.0.0.0:8787；若在 .env 里设了 HOST=127.0.0.1 也用这条
    server 127.0.0.1:8787;
    keepalive 32;
}

# HTTP → HTTPS 跳转（保留 certbot 的验证路径）
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # ---------- 证书 ----------
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    server_tokens off;

    # ---------- 体积与超时 ----------
    # 上传参考图/素材可能较大
    client_max_body_size 25m;
    client_body_timeout  60s;

    # 生成类接口会等待上游模型，不能按默认 60s 掐断
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ---------- 公共代理头 ----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---------- 静态页面（PC 工作台 + 管理后台）----------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://wangju_api;
    }

    # 管理后台建议再加一层 IP 白名单（把下面的注释打开并换成你的办公/家庭公网 IP）
    # location = /admin.html {
    #     allow 203.0.113.10;
    #     deny  all;
    #     proxy_pass http://wangju_api;
    # }

    # 健康检查：给监控/负载均衡用，不写访问日志
    location = /health {
        access_log off;
        proxy_pass http://wangju_api;
    }
}
